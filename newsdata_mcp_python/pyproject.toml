[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newsdata-mcp"
version = "0.1.0"
description = "Read-only MCP server for enriched financial news in Elasticsearch"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch[async]>=8.17,<8.18",
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
newsdata-mcp = "newsdata_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

