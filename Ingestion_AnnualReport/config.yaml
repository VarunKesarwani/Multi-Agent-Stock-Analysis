# Non-secret defaults. Precedence: process environment > .env > this file.
# Paths are relative to the .env directory, even when .env does not exist.
EMBEDDING_TYPE: ollama
EMBEDDING_MODEL: nomic-embed-text
OLLAMA_URL: http://localhost:11434
QDRANT_URL: http://localhost:6333
QDRANT_COLLECTION: annual_reports
CHUNK_SIZE_CHARS: 4000
CHUNK_OVERLAP_CHARS: 400
EMBED_BATCH_SIZE: 8
LLM_PROVIDER: ollama
LLM_MODEL: llama3.2:3b
LLM_TIMEOUT_SECONDS: 120
LLM_MAX_TOKENS: 1024
RAG_TOP_K: 5
RAG_CONTEXT_CHARS: 16000
LOG_FILE: logs/app.log
