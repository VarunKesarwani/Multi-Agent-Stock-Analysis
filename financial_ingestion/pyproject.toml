[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "financial-ingestion"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pymongo>=4.8,<5", "pika>=1.3,<2", "requests>=2.32,<3", "lxml>=5,<7", "python-dateutil>=2.9,<3", "python-dotenv>=1,<2"]
[project.optional-dependencies]
notebook = ["psycopg[binary]>=3.2,<4", "ipykernel>=6,<8"]
test = ["pytest>=8,<10"]
[project.scripts]
financial-ingestion = "financial_ingestion.cli:main"
[tool.setuptools.packages.find]
include = ["financial_ingestion*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local MongoDB replica set and RabbitMQ"]
