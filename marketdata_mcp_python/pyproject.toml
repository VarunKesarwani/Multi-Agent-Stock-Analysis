[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[project]
name = "marketdata-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["mcp>=2.3,<3", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
marketdata-mcp = "marketdata_mcp.server:main"
marketdata-validate = "marketdata_mcp.validate:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
