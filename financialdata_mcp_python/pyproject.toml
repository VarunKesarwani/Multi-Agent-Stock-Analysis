[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "financialdata-mcp"
version = "0.1.0"
description = "Read-only MCP server for normalized financial facts in MongoDB"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
  "pymongo>=4.11,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
financialdata-mcp = "financialdata_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

