services:
  timescaledb:
    image: timescale/timescaledb:2.23.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Ingestion_Price/.env}
      POSTGRES_DB: ${POSTGRES_DB:-StockAnalysis_Bhavcopy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-6543}:5432"
    volumes:
      - price_timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  price_timescaledb_data:
