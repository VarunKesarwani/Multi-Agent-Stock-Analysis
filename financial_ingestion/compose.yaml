# Development services. Set RABBITMQ_USER and RABBITMQ_PASSWORD in .env or your shell.
services:
  consumer:
    build: .
    restart: unless-stopped
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DATABASE: ${MONGO_DATABASE:-financial_ingestion}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20
volumes:
  mongo_data:
  rabbit_data:
